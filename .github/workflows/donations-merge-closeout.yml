name: Stripe merge preservation and closeout
on:
  push:
    branches: [main, codex/stripe-donations-integration]
    paths:
      - wrangler.jsonc
      - .github/workflows/donations-merge-closeout.yml
      - scripts/check-stripe-merge-closeout.mjs
      - tests/donations-live-deploy.test.mjs
permissions:
  contents: read
jobs:
  regression:
    if: github.repository == 'Ithemba-Kuluntu-NPC/ithemba-kuluntu-connect' && (github.ref == 'refs/heads/main' || github.event.head_commit.message == 'Verify Stripe merge preservation and production binding configuration')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.3"
      - name: Install locked dependencies without account credentials
        run: bun install --frozen-lockfile
      - name: Run existing regression checks and build
        env:
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_LOG_PATH: ${{ runner.temp }}/stripe-merge-build.log
        run: |
          env GITHUB_ACTIONS=false node --test --test-isolation=none tests/*.test.*
          npm run typecheck
          npm run build:donations-staging
      - name: Verify live binding preservation without changing Worker or payment objects
        env:
          CLOUDFLARE_D1_STAGING: ${{ secrets.CLOUDFLARE_D1_STAGING }}
          CLOUDFLARE_WORKER_STAGING_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_STAGING_TOKEN }}
        run: |
          node --check scripts/check-stripe-merge-closeout.mjs
          node scripts/check-stripe-merge-closeout.mjs
# Verify the combined current-main project pages and donation configuration before merging.
