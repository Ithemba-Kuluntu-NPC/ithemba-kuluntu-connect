name: Verify uncharged sandbox Checkout and signed expiration webhooks

on:
  push:
    branches: [codex/stripe-donations-integration]
    paths:
      - .github/workflows/stripe-sandbox-smoke.yml
      - scripts/smoke-stripe-sandbox.mjs
      - tests/stripe-sandbox-smoke.test.mjs

permissions:
  contents: read

jobs:
  smoke:
    if: github.repository == 'Ithemba-Kuluntu-NPC/ithemba-kuluntu-connect' && github.ref == 'refs/heads/codex/stripe-donations-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.3"
      - name: Install locked dependencies without credentials
        run: bun install --frozen-lockfile
      - name: Test staging-only smoke checks without credentials
        env:
          WRANGLER_LOG_PATH: ${{ runner.temp }}/smoke-tests.log
          WRANGLER_SEND_METRICS: "false"
        run: env GITHUB_ACTIONS=false node --test --test-isolation=none tests/stripe-sandbox-smoke.test.mjs
      - name: Create and expire two sandbox Checkouts; verify actual signed webhook delivery
        env:
          CLOUDFLARE_D1_STAGING: ${{ secrets.CLOUDFLARE_D1_STAGING }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/smoke-readonly-db.log
          WRANGLER_SEND_METRICS: "false"
        run: node scripts/smoke-stripe-sandbox.mjs
