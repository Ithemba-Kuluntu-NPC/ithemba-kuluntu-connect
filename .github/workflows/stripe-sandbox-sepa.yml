name: Verify sandbox SEPA pending state and asynchronous settlement
on:
  push:
    branches: [codex/stripe-donations-integration]
    paths:
      - .github/workflows/stripe-sandbox-sepa.yml
      - scripts/check-stripe-sandbox-sepa.mjs
permissions:
  contents: read
jobs:
  sepa:
    if: github.repository == 'Ithemba-Kuluntu-NPC/ithemba-kuluntu-connect' && github.ref == 'refs/heads/codex/stripe-donations-integration' && github.event.head_commit.message == 'Verify approved isolated sandbox SEPA success and delayed failure'
    strategy:
      fail-fast: false
      matrix:
        scenario: [success, failure]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.3"
      - name: Install locked dependencies without credentials
        run: bun install --frozen-lockfile
      - name: Install temporary pinned browser without credentials
        run: |
          npm install --prefix "$RUNNER_TEMP/stripe-browser" --no-save --package-lock=false --ignore-scripts playwright@1.64.1
          node "$RUNNER_TEMP/stripe-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check syntax and test only the isolated staging SEPA flow
        env:
          STRIPE_BROWSER_MODULE_DIR: ${{ runner.temp }}/stripe-browser/node_modules/playwright
          CLOUDFLARE_D1_STAGING: ${{ secrets.CLOUDFLARE_D1_STAGING }}
          SEPA_TEST_SCENARIO: ${{ matrix.scenario }}
        run: |
          node --check scripts/check-stripe-sandbox-sepa.mjs
          if [ "$SEPA_TEST_SCENARIO" = "failure" ]; then
            node scripts/check-stripe-sandbox-sepa.mjs --expect-failure
          else
            node scripts/check-stripe-sandbox-sepa.mjs
          fi
