# User approved isolated staging sandbox activation on 18 October 2026.
# Apply the verified EUR presentment fix to this isolated test Worker only.
name: Prepare or explicitly activate isolated Stripe sandbox

on:
  push:
    branches: [codex/stripe-donations-integration]
    paths:
      - .github/workflows/stripe-sandbox-activate.yml
      - scripts/activate-stripe-sandbox.mjs
      - tests/stripe-sandbox-activation.test.mjs

permissions:
  contents: read

concurrency:
  group: donations-staging-worker
  cancel-in-progress: false

jobs:
  sandbox:
    if: github.repository == 'Ithemba-Kuluntu-NPC/ithemba-kuluntu-connect' && github.ref == 'refs/heads/codex/stripe-donations-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.3"
      - name: Install locked dependencies without credentials
        run: bun install --frozen-lockfile
      - name: Test code and sandbox isolation without credentials
        env:
          WRANGLER_LOG_PATH: ${{ runner.temp }}/sandbox-tests.log
          WRANGLER_SEND_METRICS: "false"
        run: |
          env GITHUB_ACTIONS=false node --test --test-isolation=none tests/donations.test.ts tests/donations-staging.test.mjs tests/donations-staging-migration.test.mjs tests/donations-staging-deploy.test.mjs tests/stripe-sandbox-setup.test.mjs tests/stripe-sandbox-readiness.test.mjs tests/stripe-portal-link.test.mjs tests/stripe-sandbox-activation.test.mjs tests/stripe-sandbox-smoke.test.mjs
          npm run typecheck
      - name: Build and check the isolated staging artifact without credentials
        env:
          WRANGLER_LOG_PATH: ${{ runner.temp }}/sandbox-build.log
          WRANGLER_SEND_METRICS: "false"
        run: npm run build:donations-staging
      - name: Read-only Stripe and Cloudflare activation preflight
        env:
          CLOUDFLARE_D1_STAGING: ${{ secrets.CLOUDFLARE_D1_STAGING }}
          CLOUDFLARE_WORKER_STAGING_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_STAGING_TOKEN }}
          STRIPE_SANDBOX_CONNECTION: ${{ secrets.STRIPE_SANDBOX_CONNECTION }}
          STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/sandbox-preflight.log
          WRANGLER_SEND_METRICS: "false"
        run: node scripts/activate-stripe-sandbox.mjs preflight
      - name: Activate sandbox only after explicit user approval
        if: github.event.head_commit.message == 'Activate approved Stripe sandbox on isolated staging Worker'
        env:
          STRIPE_SANDBOX_ACTIVATION_APPROVED: "true"
          CLOUDFLARE_D1_STAGING: ${{ secrets.CLOUDFLARE_D1_STAGING }}
          CLOUDFLARE_WORKER_STAGING_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_STAGING_TOKEN }}
          STRIPE_SANDBOX_CONNECTION: ${{ secrets.STRIPE_SANDBOX_CONNECTION }}
          STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/sandbox-activation.log
          WRANGLER_SEND_METRICS: "false"
        run: node scripts/activate-stripe-sandbox.mjs activate
