name: Read-only audit of isolated staging donation script
on:
  push:
    branches: [codex/stripe-donations-integration]
    paths:
      - .github/workflows/stripe-staging-script-audit.yml
      - scripts/check-stripe-staging-script.mjs
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'Ithemba-Kuluntu-NPC/ithemba-kuluntu-connect' && github.ref == 'refs/heads/codex/stripe-donations-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.3"
      - name: Install locked dependencies without credentials
        run: bun install --frozen-lockfile
      - name: Inspect only staging script and target metadata without writes
        env:
          CLOUDFLARE_D1_STAGING: ${{ secrets.CLOUDFLARE_D1_STAGING }}
          CLOUDFLARE_WORKER_STAGING_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_STAGING_TOKEN }}
        run: node scripts/check-stripe-staging-script.mjs
