# Recheck the beneficiary account after the operator saved the live connection.
name: Prepare live Stripe account (read only, never deploy)
on:
  push:
    branches: [codex/stripe-donations-integration]
    paths:
      - .github/workflows/stripe-live-preparation.yml
      - scripts/check-stripe-live-account.mjs
      - tests/stripe-live-preparation.test.mjs
      - scripts/check-stripe-live-portal.mjs
      - tests/stripe-live-portal.test.mjs
      - scripts/check-stripe-live-domain.mjs
      - tests/stripe-live-domain.test.mjs
      - config/stripe-donations-live.example.json
      - scripts/check-donations-live-database.mjs
      - tests/donations-live-database.test.mjs
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'Ithemba-Kuluntu-NPC/ithemba-kuluntu-connect' && github.ref == 'refs/heads/codex/stripe-donations-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.3"
      - name: Install locked dependencies without credentials
        run: bun install --frozen-lockfile
      - name: Run donation regression checks and build without credentials
        env:
          WRANGLER_LOG_PATH: ${{ runner.temp }}/live-preparation-tests.log
          WRANGLER_SEND_METRICS: "false"
        run: |
          env GITHUB_ACTIONS=false node --test --test-isolation=none tests/*.test.*
          npm run typecheck
          npm run build:donations-staging
      - name: Verify read-only preparation safeguards without credentials
        run: env GITHUB_ACTIONS=false node --test --test-isolation=none tests/stripe-live-preparation.test.mjs tests/stripe-live-portal.test.mjs tests/stripe-live-domain.test.mjs tests/donations-live-database.test.mjs
      - name: Report live account readiness without changing it
        env:
          STRIPE_LIVE_CONNECTION: ${{ secrets.STRIPE_LIVE_CONNECTION }}
        run: node scripts/check-stripe-live-account.mjs
      - name: Read live Portal configuration without creating sessions or changing settings
        env:
          STRIPE_LIVE_CONNECTION: ${{ secrets.STRIPE_LIVE_CONNECTION }}
        run: node scripts/check-stripe-live-portal.mjs
      - name: Read live domain readiness without registering or changing domains
        env:
          STRIPE_LIVE_CONNECTION: ${{ secrets.STRIPE_LIVE_CONNECTION }}
        run: node scripts/check-stripe-live-domain.mjs
      - name: Verify live database target and pending migration without writes
        env:
          CLOUDFLARE_D1_STAGING: ${{ secrets.CLOUDFLARE_D1_STAGING }}
        run: node scripts/check-donations-live-database.mjs
