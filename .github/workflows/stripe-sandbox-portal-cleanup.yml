name: Diagnose Portal access and cancel only the synthetic sandbox subscription

on:
  push:
    branches: [codex/stripe-donations-integration]
    paths:
      - .github/workflows/stripe-sandbox-portal-cleanup.yml
      - scripts/cleanup-stripe-sandbox-portal.mjs

permissions:
  contents: read

jobs:
  cleanup:
    if: github.repository == 'Ithemba-Kuluntu-NPC/ithemba-kuluntu-connect' && github.ref == 'refs/heads/codex/stripe-donations-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.3"
      - name: Install locked dependencies without credentials
        run: bun install --frozen-lockfile
      - name: Check cleanup script syntax
        run: node --check scripts/cleanup-stripe-sandbox-portal.mjs
      - name: Check Portal session permission before setting up a browser
        env:
          CLOUDFLARE_D1_STAGING: ${{ secrets.CLOUDFLARE_D1_STAGING }}
          STRIPE_SANDBOX_CONNECTION: ${{ secrets.STRIPE_SANDBOX_CONNECTION }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/portal-access.log
          WRANGLER_SEND_METRICS: "false"
        run: node scripts/cleanup-stripe-sandbox-portal.mjs --check-access
      - name: Install temporary pinned browser without credentials
        run: |
          npm install --prefix "$RUNNER_TEMP/stripe-browser" --no-save --package-lock=false --ignore-scripts playwright@1.64.1
          node "$RUNNER_TEMP/stripe-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Diagnose Portal permissions and clean up only the verified test fixture
        env:
          STRIPE_BROWSER_MODULE_DIR: ${{ runner.temp }}/stripe-browser/node_modules/playwright
          CLOUDFLARE_D1_STAGING: ${{ secrets.CLOUDFLARE_D1_STAGING }}
          STRIPE_SANDBOX_CONNECTION: ${{ secrets.STRIPE_SANDBOX_CONNECTION }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/portal-cleanup.log
          WRANGLER_SEND_METRICS: "false"
        run: node scripts/cleanup-stripe-sandbox-portal.mjs
