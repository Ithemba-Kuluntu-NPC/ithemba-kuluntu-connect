name: Verify monthly renewals with a disposable sandbox Test Clock
on:
  push:
    branches: [codex/stripe-donations-integration]
    paths:
      - .github/workflows/stripe-sandbox-renewals.yml
      - scripts/check-stripe-sandbox-renewals.mjs
permissions:
  contents: read
jobs:
  renewals:
    if: github.repository == 'Ithemba-Kuluntu-NPC/ithemba-kuluntu-connect' && github.ref == 'refs/heads/codex/stripe-donations-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.3"
      - name: Install locked dependencies without credentials
        run: bun install --frozen-lockfile
      - name: Install temporary pinned browser without credentials
        run: |
          npm install --prefix "$RUNNER_TEMP/stripe-browser" --no-save --package-lock=false --ignore-scripts playwright@1.64.1
          node "$RUNNER_TEMP/stripe-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test only a disposable clock fixture; always remove it afterwards
        env:
          STRIPE_BROWSER_MODULE_DIR: ${{ runner.temp }}/stripe-browser/node_modules/playwright
          STRIPE_SANDBOX_CONNECTION: ${{ secrets.STRIPE_SANDBOX_CONNECTION }}
        run: |
          node --check scripts/check-stripe-sandbox-renewals.mjs
          node scripts/check-stripe-sandbox-renewals.mjs
