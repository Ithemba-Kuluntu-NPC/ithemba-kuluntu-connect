name: Read-only sandbox accelerated-renewal access check
on:
  push:
    branches: [codex/stripe-donations-integration]
    paths:
      - .github/workflows/stripe-sandbox-renewal-access.yml
      - scripts/check-stripe-sandbox-renewal-access.mjs
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'Ithemba-Kuluntu-NPC/ithemba-kuluntu-connect' && github.ref == 'refs/heads/codex/stripe-donations-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Check syntax without credentials
        run: node --check scripts/check-stripe-sandbox-renewal-access.mjs
      - name: Probe test-clock read permission without changing anything
        env:
          STRIPE_SANDBOX_CONNECTION: ${{ secrets.STRIPE_SANDBOX_CONNECTION }}
        run: node scripts/check-stripe-sandbox-renewal-access.mjs
