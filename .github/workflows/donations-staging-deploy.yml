name: Deploy approved donations staging Worker

on:
  push:
    branches: [codex/stripe-donations-integration]
    paths:
      - .github/workflows/donations-staging-deploy.yml
      - scripts/deploy-donations-staging.mjs
      - tests/donations-staging-deploy.test.mjs

permissions:
  contents: read

concurrency:
  group: donations-staging-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'Ithemba-Kuluntu-NPC/ithemba-kuluntu-connect' &&
      github.event.head_commit.message == 'Deploy approved isolated donations staging Worker'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.3"
      - name: Install locked dependencies on GitHub
        run: bun install --frozen-lockfile
      - name: Test isolation, deployment safeguards and donation code
        run: |
          npm run test:donations-staging
          node --test --test-isolation=none tests/donations-staging-deploy.test.mjs
          npm run test:donations
          npm run typecheck
      - name: Check Cloudflare staging access before any deployment
        env:
          CLOUDFLARE_D1_STAGING: ${{ secrets.CLOUDFLARE_D1_STAGING }}
          CLOUDFLARE_WORKER_STAGING_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_STAGING_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: node scripts/deploy-donations-staging.mjs preflight
      - name: Build and verify the staging artifact
        run: npm run build:donations-staging
      - name: Deploy only the approved staging Worker and check its URL
        env:
          CLOUDFLARE_D1_STAGING: ${{ secrets.CLOUDFLARE_D1_STAGING }}
          CLOUDFLARE_WORKER_STAGING_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_STAGING_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: node scripts/deploy-donations-staging.mjs
