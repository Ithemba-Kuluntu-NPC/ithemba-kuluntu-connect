name: Check direct PayPal donations
on:
  pull_request:
    paths:
      - src/lib/paypal.server.ts
      - src/components/blocks/PayPalDonation.tsx
      - src/components/blocks/DonationWidget.tsx
      - src/server.ts
      - migrations/0002_paypal.sql
      - tests/paypal.test.ts
      - .github/workflows/paypal-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.3"
      - run: bun install --frozen-lockfile
      - run: node --test --test-isolation=none tests/paypal.test.ts tests/donations.test.ts
      - run: npm run typecheck
      - run: npm run build
