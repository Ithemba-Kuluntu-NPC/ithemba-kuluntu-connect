name: Deploy owner-approved live Stripe donations without merging
on:
  push:
    branches: [codex/stripe-donations-integration]
    paths:
      - .github/workflows/donations-live-launch.yml
      - scripts/deploy-donations-live.mjs
      - tests/donations-live-deploy.test.mjs
permissions:
  contents: read
concurrency:
  group: donations-production-launch
  cancel-in-progress: false
jobs:
  launch:
    if: github.repository == 'Ithemba-Kuluntu-NPC/ithemba-kuluntu-connect' && github.ref == 'refs/heads/codex/stripe-donations-integration' && github.event.head_commit.message == 'Deploy owner-approved live Stripe donations without merging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 20
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.3"
      - name: Install locked dependencies without account credentials
        run: bun install --frozen-lockfile
      - name: Run all regression/security checks and build without credentials
        env:
          WRANGLER_LOG_PATH: ${{ runner.temp }}/live-launch-checks.log
          WRANGLER_SEND_METRICS: "false"
        run: |
          env GITHUB_ACTIONS=false node --test --test-isolation=none tests/*.test.*
          npm run typecheck
          npm run build:donations-staging
          git restore -- src/routeTree.gen.ts
      - name: Verify baseline, upload inactive version, preserve bindings, switch and verify
        env:
          CLOUDFLARE_D1_STAGING: ${{ secrets.CLOUDFLARE_D1_STAGING }}
          CLOUDFLARE_WORKER_STAGING_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_STAGING_TOKEN }}
          STRIPE_LIVE_CONNECTION: ${{ secrets.STRIPE_LIVE_CONNECTION }}
          STRIPE_LIVE_WEBHOOK_SECRET: ${{ secrets.STRIPE_LIVE_WEBHOOK_SECRET }}
          STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}
        run: node scripts/deploy-donations-live.mjs
