name: Inspect supplied public sandbox Portal link read only

on:
  push:
    branches: [codex/stripe-donations-integration]
    paths:
      - .github/workflows/stripe-portal-link-check.yml
      - scripts/inspect-stripe-portal-link.mjs
      - tests/stripe-portal-link.test.mjs

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'Ithemba-Kuluntu-NPC/ithemba-kuluntu-connect' && github.ref == 'refs/heads/codex/stripe-donations-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Test read-only and non-disclosure safeguards
        run: node --test --test-isolation=none tests/stripe-portal-link.test.mjs
      - name: Inspect only the supplied public test link and expected sandbox account
        env:
          STRIPE_SANDBOX_CONNECTION: ${{ secrets.STRIPE_SANDBOX_CONNECTION }}
        run: node scripts/inspect-stripe-portal-link.mjs
