name: Prepare donations staging database

on:
  push:
    branches: [codex/stripe-donations-integration]
    paths:
      - .github/workflows/donations-staging-database.yml
      - scripts/migrate-donations-staging.mjs
      - scripts/check-donations-staging.mjs
      - tests/donations-staging-migration.test.mjs
      - wrangler.donations-staging.jsonc
      - migrations/0001_donations.sql

permissions:
  contents: read

concurrency:
  group: donations-staging-database
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'Ithemba-Kuluntu-NPC/ithemba-kuluntu-connect'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check that Cloudflare authorization has been saved
        env:
          CLOUDFLARE_D1_STAGING: ${{ secrets.CLOUDFLARE_D1_STAGING }}
        run: |
          if [ -z "$CLOUDFLARE_D1_STAGING" ]; then
            echo "::error::Save the CLOUDFLARE_D1_STAGING repository secret using docs/stripe-donations-browser-setup.md, then rerun this job. No Cloudflare operation has been performed."
            exit 1
          fi
      - name: Check out the existing donations branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.3"
      - name: Install locked dependencies on GitHub (nothing to install on your computer)
        run: bun install --frozen-lockfile
      - name: Check staging isolation and migration safeguards
        run: |
          npm run check:donations-staging
          npm run test:donations-staging
          node --test --test-isolation=none tests/donations-staging-migration.test.mjs
      - name: Verify account and database, list and apply the approved migration, verify tables
        env:
          CLOUDFLARE_D1_STAGING: ${{ secrets.CLOUDFLARE_D1_STAGING }}
          WRANGLER_SEND_METRICS: "false"
        run: node scripts/migrate-donations-staging.mjs
