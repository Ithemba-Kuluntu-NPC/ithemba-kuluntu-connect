name: Test sandbox card payments and recurring cancellation in Stripe UI

on:
  push:
    branches: [codex/stripe-donations-integration]
    paths:
      - .github/workflows/stripe-sandbox-browser.yml
      - scripts/browser-stripe-sandbox.mjs

permissions:
  contents: read

jobs:
  browser:
    if: github.repository == 'Ithemba-Kuluntu-NPC/ithemba-kuluntu-connect' && github.ref == 'refs/heads/codex/stripe-donations-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.3"
      - name: Install locked project dependencies without credentials
        run: bun install --frozen-lockfile
      - name: Install pinned browser tooling in runner temp only
        run: |
          npm install --prefix "$RUNNER_TEMP/stripe-browser" --no-save --package-lock=false --ignore-scripts playwright@1.64.1
          node "$RUNNER_TEMP/stripe-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check browser test syntax
        run: node --check scripts/browser-stripe-sandbox.mjs
      - name: Verify card success, registered signed webhooks and secure recurring management
        env:
          STRIPE_BROWSER_MODULE_DIR: ${{ runner.temp }}/stripe-browser/node_modules/playwright
          CLOUDFLARE_D1_STAGING: ${{ secrets.CLOUDFLARE_D1_STAGING }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/browser-d1-check.log
          WRANGLER_SEND_METRICS: "false"
        run: node scripts/browser-stripe-sandbox.mjs
