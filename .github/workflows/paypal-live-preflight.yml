name: Inspect direct PayPal live readiness
on:
  push:
    branches: [codex/direct-paypal-donations]
    paths:
      - .github/workflows/paypal-live-preflight.yml
      - scripts/check-paypal-live.mjs
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'Ithemba-Kuluntu-NPC/ithemba-kuluntu-connect' && github.event.head_commit.message == 'Inspect direct PayPal live readiness without changing production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Read-only Cloudflare and public health checks
        env:
          CLOUDFLARE_D1_STAGING: ${{ secrets.CLOUDFLARE_D1_STAGING }}
          CLOUDFLARE_WORKER_STAGING_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_STAGING_TOKEN }}
        run: node scripts/check-paypal-live.mjs
